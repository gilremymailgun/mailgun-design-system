name: Deploy prototype to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            prototypes-app/package-lock.json

      - name: Install Storybook dependencies
        run: npm ci

      - name: Install prototype dependencies
        run: npm ci
        working-directory: prototypes-app

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Storybook site
        run: npm run build-storybook

      - name: Build prototype
        run: npm exec -- vite build
        working-directory: prototypes-app
        env:
          VITE_BASE_PATH: /mailgun-design-system/prototypes/

      - name: Add prototype under Storybook site
        run: |
          mkdir -p storybook-static/prototypes
          cp -R prototypes-app/dist/. storybook-static/prototypes/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4